name: dashboard

on:
  push:
    branches: [main]
    paths:
      - "DOZO-Dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "DOZO-Dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DOZO-Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
