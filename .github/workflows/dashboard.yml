name: dashboard

on:
  push:
    branches: [main]
    paths:
      - "papier-dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "papier-dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papier-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test
