name: server

on:
  push:
    branches: [main]
    paths:
      - "DOZO-Server/**"
      - "CONTRACTS.md"
      - "contracts/db-schema.md"
      - "contracts/http-api.md"
      - "contracts/env.md"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "DOZO-Server/**"
      - "CONTRACTS.md"
      - "contracts/db-schema.md"
      - "contracts/http-api.md"
      - "contracts/env.md"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DOZO-Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
