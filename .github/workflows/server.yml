name: server

on:
  push:
    branches: [main]
    paths:
      - "papier-redirect-server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "papier-redirect-server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papier-redirect-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
