name: app

on:
  push:
    branches: [main]
    paths:
      - "DOZO-App/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "DOZO-App/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build + unit test
        working-directory: DOZO-App
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :mockpay:assembleDebug --console=plain
