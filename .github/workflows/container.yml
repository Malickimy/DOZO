name: container

on:
  push:
    branches: [main]
    paths:
      - "DOZO-Server/**"
      - "DOZO-Dashboard/**"
      - "CONTRACTS.md"
      - "contracts/db-schema.md"
      - "contracts/http-api.md"
      - "contracts/dashboard.md"
      - "contracts/env.md"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "DOZO-Server/**"
      - "DOZO-Dashboard/**"
      - "CONTRACTS.md"
      - "contracts/db-schema.md"
      - "contracts/http-api.md"
      - "contracts/dashboard.md"
      - "contracts/env.md"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The image never runs Vite: build the SPA here, then stage it into the
      # server build context at DOZO-Server/public (the Dockerfile copies it).
      - name: Build dashboard SPA
        working-directory: DOZO-Dashboard
        run: |
          npm ci
          npm run build

      - name: Stage SPA into the server build context
        run: |
          rm -rf DOZO-Server/public
          cp -R DOZO-Dashboard/dist DOZO-Server/public

      - name: Validate compose config
        run: docker compose -f DOZO-Server/docker-compose.yml config

      - name: Build image
        run: docker build -f DOZO-Server/Dockerfile -t dozo-server:ci .

      # Boots the dashboard + connector from compose and asserts the public
      # round-trip: /r/:id twice -> exactly one deduped scan, plus the SPA.
      - name: Smoke test compose round-trip
        run: DOZO-Server/scripts/container-smoke.sh
