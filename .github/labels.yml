# Reference manifest only. Apply these labels in GitHub; this file does not sync labels.
# Colors group by family: workstreams blue, types neutral gray (bug is a soft-red
# exception), states purple, priorities traffic light (red/yellow/green), flags teal.
# Muted classification colors keep priority labels visually urgent.
labels:
  # Workstreams - shades of blue
  - name: "root"
    color: "1e3a8a"
    description: "Cross-project planning, contracts, tooling, and CI"
  - name: "server"
    color: "1d4ed8"
    description: "Shared Fastify backend work"
  - name: "app"
    color: "3b82f6"
    description: "Android terminal application work"
  - name: "dashboard"
    color: "60a5fa"
    description: "Merchant and operator dashboard work"
  - name: "website"
    color: "bfdbfe"
    description: "Public marketing website work"
  # Types - neutral gray (bug is a soft-red exception)
  - name: "capability"
    color: "52525b"
    description: "Parent issue for an end-to-end product outcome"
  - name: "task"
    color: "d4d4d8"
    description: "Project-owned implementation task"
  - name: "maintenance"
    color: "a1a1aa"
    description: "Independent maintenance or refactoring task"
  - name: "qa"
    color: "71717a"
    description: "Verification task with explicit acceptance evidence"
  - name: "bug"
    color: "fecaca"
    description: "Reproducible defect"
  # States - shades of purple
  - name: "ready"
    color: "ede9fe"
    description: "Approved, complete, unblocked, and ready for one task run"
  - name: "in-progress"
    color: "c4b5fd"
    description: "Implementation or verification is active"
  - name: "in-review"
    color: "8b5cf6"
    description: "Implementation is complete and a pull request is under review"
  - name: "blocked"
    color: "5b21b6"
    description: "Waiting on a named decision or prerequisite"
  # Priorities - traffic light
  - name: "p0"
    color: "b60205"
    description: "Urgent production or release blocker"
  - name: "p1"
    color: "fbca04"
    description: "Required for the active capability or robustness gate"
  - name: "p2"
    color: "0e8a16"
    description: "Useful independent improvement or later work"
  # Flags
  - name: "db-change"
    color: "0f766e"
    description: "Changes the database schema, migrations, or persisted data shape"
