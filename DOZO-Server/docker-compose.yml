# One unified service per client — one image, one container, one datastore:
#   server - serves the public /health + /r/:terminal_id redirect surface, every
#            /api/* route and the built SPA from one SQLite database.
#
# The build context is the monorepo root. The SPA is NOT built in the image: CI
# builds DOZO-Dashboard/dist and stages it at DOZO-Server/public first (see
# .github/workflows/container.yml), then this image copies it to /app/public.
# For a local build: build the SPA, copy it to DOZO-Server/public, then run
# `docker compose -f DOZO-Server/docker-compose.yml up --build`.
#
# Per-client isolation (template): run one stack per client with a distinct
# Compose project name so the named datastore volume is namespaced and never
# shared:
#   COMPOSE_PROJECT_NAME=dozo-<client> \
#     docker compose -f DOZO-Server/docker-compose.yml up -d --build
# Never run two clients in one Compose project.
services:
  server:
    build:
      context: ..
      dockerfile: DOZO-Server/Dockerfile
    image: dozo-server:local
    command: ["node", "src/server.js"]
    ports:
      - "3000:3000"
    # Runtime config comes from DOZO-Server/.env (copy .env.production.example).
    # Optional so `docker compose config` still renders without a local .env.
    env_file:
      - path: .env
        required: false
    environment:
      # The single datastore, on the service's one named volume.
      DB_PATH: /data/dozo.db
    volumes:
      - dozo-server-data:/data
    restart: unless-stopped

volumes:
  dozo-server-data:
