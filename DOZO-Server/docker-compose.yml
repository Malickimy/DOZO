services:
  dozo-server:
    build: .
    image: dozo-server:local
    ports:
      - "3000:3000"
    # Runtime config comes from .env (copy .env.production.example -> .env).
    env_file:
      - .env
    environment:
      # Must win over DB_PATH in .env so SQLite lives on the named volume.
      DB_PATH: /data/dozo.db
    volumes:
      - dozo-data:/data
    restart: unless-stopped

volumes:
  dozo-data:
